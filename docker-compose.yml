services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cagnotte
      POSTGRES_PASSWORD: cagnotte
      POSTGRES_DB: cagnotte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cagnotte"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cagnotte:cagnotte@postgres:5432/cagnotte
      PORT: "3001"
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      SESSION_HOURS: "72"
      SEED: "1"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
